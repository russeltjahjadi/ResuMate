[project]
name = "resumate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "russeltjahjadi", email = "russel.tjahjadi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.18.1",
    "openai>=3.2.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.61.1",
]

[project.scripts]
resumate = "resumate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
